name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  EMULATOR_PACKAGES: adapter-next apple aws clerk core github google microsoft mongoatlas okta resend slack stripe vercel

jobs:
  check-release:
    name: Check for new version
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: jdx/mise-action@v4

      - name: Identify npm client
        run: |
          command -v npm
          npm --version

      - name: Compare versions to registry
        id: check
        run: node scripts/check-release.mjs

  publish:
    name: Publish
    needs: check-release
    if: needs.check-release.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    environment: Release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: jdx/mise-action@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify toolchain
        run: |
          command -v npm
          node scripts/check-toolchain.mjs

      - name: Build
        run: pnpm build

      - name: Publish packages
        run: |
          LOCAL_VERSION="${{ needs.check-release.outputs.version }}"
          FAILED=""
          # Recheck exact versions in case another release completed during the build.
          PACKAGES=$(node scripts/check-release.mjs --list)

          # pnpm pack resolves workspace:* protocols in the tarball;
          # npm publish handles OIDC trusted-publisher auth.
          publish_pkg() {
            local dir="$1" name="$2"
            echo "Publishing $name@$LOCAL_VERSION..."
            TARBALL=$(cd "$dir" && pnpm pack --pack-destination /tmp | tail -1)
            if ! npm publish "$TARBALL" --provenance --access public; then
              FAILED="$FAILED $name"
            fi
          }

          for name in $PACKAGES; do
            publish_pkg "packages/$name" "$name"
          done

          if [ -n "$FAILED" ]; then
            echo "Failed to publish:$FAILED"
            exit 1
          fi

  github-release:
    name: Create GitHub Release
    needs: [check-release, publish]
    if: needs.check-release.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract changelog entry
        run: |
          VERSION="${{ needs.check-release.outputs.version }}"

          awk '/<!-- release:start -->/{found=1; next} /<!-- release:end -->/{found=0} found{print}' CHANGELOG.md > /tmp/release-notes.md

          LINES=$(wc -l < /tmp/release-notes.md | tr -d ' ')
          if [ "$LINES" -lt 2 ]; then
            echo "Error: No release notes found between <!-- release:start --> and <!-- release:end --> markers in CHANGELOG.md"
            exit 1
          fi
          echo "Extracted release notes for $VERSION ($LINES lines)"

      - name: Create GitHub Release
        run: |
          VERSION="${{ needs.check-release.outputs.version }}"
          TAG="v$VERSION"

          if gh release view "$TAG" &>/dev/null; then
            echo "Release $TAG already exists, skipping"
          else
            echo "Creating release $TAG..."
            gh release create "$TAG" \
              --title "$TAG" \
              --target ${{ github.sha }} \
              --notes-file /tmp/release-notes.md
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
