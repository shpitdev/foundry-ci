name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      # Full history so turbo --affected can diff a PR against its base.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # Reuse turbo's cache across runs (no remote cache configured).
      - uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      - run: node scripts/sync-versions.mjs --check

      - run: pnpm format:check

      # PRs build/check only the packages affected since the base branch;
      # pushes to main run the full graph.
      - name: Build, type-check, lint, test
        run: >
          pnpm exec turbo run build type-check lint test
          --cache-dir=.turbo
          ${{ github.event_name == 'pull_request' && '--affected' || '' }}
        env:
          TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha || '' }}
