minimumReleaseAge: 2880

allowBuilds:
  "@mongodb-js/zstd@7.0.0": false
  "esbuild@0.28.2": false
  "node-liblzma@2.2.0": false
  "sharp@0.35.5": false
  "unrs-resolver@1.12.2": false

packages:
  - "packages/*"
  - "packages/@emulators/*"
  - "apps/*"
  - "examples/*"

# Keep the docs app and every embedded example on the same framework release.
catalog:
  next: 16.4.3
  "@next/mdx": 16.4.3
  eslint-config-next: 16.4.3
  react: 19.3.1
  react-dom: 19.3.1

# @ai-sdk/provider-utils and @vercel/blob still resolve undici 6.29.0.
overrides:
  "undici@>=6 <6.29.1": 6.29.1
