minimumReleaseAge: 2880

allowBuilds:
  "@mongodb-js/zstd@7.0.0": false
  "esbuild@0.28.2": false
  "node-liblzma@2.2.0": false
  "sharp@0.35.5": false
  "unrs-resolver@1.12.2": false

packages:
  - "packages/*"
  - "packages/@emulators/*"
  - "apps/*"
  - "examples/*"

# Keep the docs app and every embedded example on the same framework release.
catalog:
  next: 16.4.3
  "@next/mdx": 16.4.3
  eslint-config-next: 16.4.3
  react: 19.3.1
  react-dom: 19.3.1

# Security floors for transitive dependencies whose parents pin exact vulnerable
# versions. Drop each one once its parent ships a release that pins a patched one.
overrides:
  # just-bash 3.6.0 pins guarded-fetch 0.1.3, which pins undici 7.29.0.
  "undici@>=7 <7.30.1": 7.30.1
  # @vercel/oidc pins @vercel/cli-config 0.3.1, which pins zod 4.1.11.
  "zod@>=4 <4.6.6": 4.6.7
